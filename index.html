<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 60px 20px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
        }

        section {
            padding: 50px 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>

        <p>
            I'm building my first website using GitHub and Cloudflare.
        </p>

        <a href="#about" class="button">Learn More</a>
    </header>

    <section id="about">
        <h2>About</h2>

        <p>
            This is my first website created directly inside GitHub.
        </p>
    </section>

</body>

</html>
